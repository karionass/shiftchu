<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать профиль — ShiftChu</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap&subset=cyrillic" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
</head>
<body>
<header>
    <h1>ShiftChu — Редактировать профиль</h1>
</header>
<main>
<div class="profile-page">
    <form action="{{ url_for('edit_profile') }}" method="POST" enctype="multipart/form-data">
        <label>Имя:</label>
        <input type="text" name="name" value="{{ user.name or user.email }}" required>

        <label>Аватар:</label>
        <input type="file" name="avatar" accept="image/*">

        {% if user.avatar %}
        <p>Текущий аватар:</p>
        <img src="{{ user.avatar }}" alt="Аватар" class="avatar-preview">
        {% endif %}

        <button type="submit">Сохранить</button>
        <a href="{{ url_for('profile') }}" class="google-login-btn">Назад</a>
    </form>
</div>
</main>
</body>
</html>
